spring:
  application:
    name: nabao-backend
  profiles:
    default: local
  sql:
    init:
      mode: always
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
nabao:
  internal-key: ${INTERNAL_API_KEY:}
  collector:
    url: ${NABAO_CONTROL_URL:http://127.0.0.1:18082}
    key: ${NABAO_CONTROL_KEY:${INTERNAL_API_KEY:}}
  table-file: ${NABAO_TABLE_FILE:../.local/public/latest.json}
  status-file: ${NABAO_STATUS_FILE:../.local/status/daily-table.json}
  status-stale-seconds: ${NABAO_STATUS_STALE_SECONDS:43200}
  push-data-source: ${NABAO_PUSH_DATA_SOURCE:table}
  push-state-file: ${NABAO_PUSH_STATE_FILE:.local/push/table-state.json}
  apns:
    enabled: ${APNS_ENABLED:false}
    team-id: ${APNS_TEAM_ID:}
    key-id: ${APNS_KEY_ID:}
    bundle-id: ${APNS_BUNDLE_ID:}
    private-key-path: ${APNS_PRIVATE_KEY_PATH:}
    environment: ${APNS_ENVIRONMENT:}
    poll-delay-ms: ${APNS_POLL_DELAY_MS:60000}
    test-endpoint: ${APNS_TEST_ENDPOINT:}
