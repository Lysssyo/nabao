name: Publish images

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build Vue management app
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Verify generated management assets match the release
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- backend/src/main/resources/static/admin)" ]]; then
            echo "Vue build differs from committed management assets. Rebuild and commit the generated assets before publishing." >&2
            git diff --stat -- backend/src/main/resources/static/admin
            exit 1
          fi
      - name: Image identifiers
        id: images
        shell: bash
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build, test and verify the exact images to publish
        run: bash scripts/container-smoke.sh
      - name: Verify deployment image architecture
        shell: bash
        run: |
          for image in nabao-backend:smoke nabao-collector:smoke; do
            actual="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
            if [[ "$actual" != "linux/amd64" ]]; then
              echo "Unexpected platform for $image: $actual" >&2
              exit 1
            fi
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified images
        env:
          IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
          IMAGE_TAG: ${{ steps.images.outputs.tag }}
        run: |
          docker tag nabao-backend:smoke "$IMAGE_PREFIX/backend:$IMAGE_TAG"
          docker tag nabao-collector:smoke "$IMAGE_PREFIX/collector:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX/backend:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX/collector:$IMAGE_TAG"
